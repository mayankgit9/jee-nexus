name: import-pyq (live DB)

# Manual import of ALL real JEE Main PYQ batches (data/questions/pyq*.json —
# real exam questions 2019-2026 crawled from ExamSIDE with original exam
# figures) into the LIVE Supabase production database, through the real admin
# API pipeline (POST /api/admin/import -> needs_review).
# Uses the DATABASE_URL secret stored in repo settings during the M10
# production switch. Idempotent: duplicate publicIds are skipped server-side,
# so re-runs cannot double-insert; safe to re-run as more papers are added.
# Safety: requires typing IMPORT as input; never seeds dev data.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type IMPORT to confirm writing to the live database'
        required: true
        default: ''

jobs:
  import:
    if: ${{ github.event.inputs.confirm == 'IMPORT' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ADMIN_EMAILS: admin@jee-nexus.dev
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Generate Prisma client
        run: bunx prisma generate
      - name: Question inventory (pre-import)
        run: |
          python3 - <<'EOF'
          import glob, json
          files = sorted(glob.glob('data/questions/pyq*.json'))
          total = sum(len(json.load(open(f))) for f in files)
          print(f'PYQ batches: {len(files)} files, {total} real exam questions ready')
          EOF
      - name: Sync taxonomy (idempotent upsert of subjects/chapters)
        run: bunx tsx scripts/upsert_taxonomy.ts
      - name: Start dev server against live Supabase (NO seeding)
        run: |
          bun run dev &
          for i in $(seq 1 90); do
            curl -sS -m 2 -o /dev/null http://localhost:3000/ && break
            sleep 2
          done
          curl -sS -m 5 -o /dev/null http://localhost:3000/
      - name: Import all PYQ batches through the real admin pipeline
        run: python3 scripts/import_all_pyq.py
      - name: Post-import verification
        run: |
          python3 - <<'EOF'
          import json, urllib.request, http.client
          conn = http.client.HTTPConnection('localhost', 3000)
          conn.request('POST', '/api/auth/login',
                       json.dumps({'email': 'admin@jee-nexus.dev', 'password': 'admin-pass-123'}),
                       {'Content-Type': 'application/json'})
          r = conn.getresponse()
          setc = r.getheader('Set-Cookie') or ''
          token = setc.split('jee_nexus_session=')[-1].split(';')[0]
          req = urllib.request.Request('http://localhost:3000/api/pyq')
          req.add_header('Cookie', f'jee_nexus_session={token}')
          data = json.loads(urllib.request.urlopen(req, timeout=60).read())
          years = data.get('years', [])
          print('PYQ year overview now on live DB:')
          for y in years:
              print(f"  {y['year']}: {y['total']} questions")
          assert years, 'No PYQ years visible after import!'
          print('LIVE IMPORT VERIFIED')
          EOF

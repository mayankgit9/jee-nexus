name: apply-migration (live DB)

# Applies a SQL migration file from supabase/migrations/ to the LIVE Supabase
# database using the DATABASE_URL repo secret (set during the M10 production
# switch). Intended as the SB_PAT-less fallback when the Supabase management
# API token is unavailable: psql over the same connection the import
# workflows already use.
#
# Notes:
# - The migration files are idempotent (if-not-exists + drop-policy-if-exists
#   + do$$-exception guards), so partial application followed by a re-run is
#   safe.
# - If the secret connects as jee_app (DML-only role from 0003), DDL will
#   fail with "permission denied" — the run log makes that obvious and
#   nothing is created.
# - Safety: requires typing MIGRATE as input; never prints DATABASE_URL.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type MIGRATE to confirm writing to the live database'
        required: true
        default: ''
      migration:
        description: 'Migration file under supabase/migrations/ (default 0007_chat.sql)'
        required: false
        default: '0007_chat.sql'

jobs:
  migrate:
    if: ${{ github.event.inputs.confirm == 'MIGRATE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Sanity — connection + current role (never prints the URL)
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -tAc "select current_user || ' @ ' || current_database()"

      - name: Apply migration ${{ github.event.inputs.migration }}
        run: |
          set -o pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=0 \
            -f "supabase/migrations/${{ github.event.inputs.migration }}" 2>&1 | sed -E 's#postgresql://[^ ]*#postgresql://***#g'

      - name: Verify chat tables exist
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -tAc \
            "select table_name from information_schema.tables where table_schema='public' and table_name like 'chat_%' order by 1"

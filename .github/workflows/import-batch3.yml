name: import-batch3 (live DB)

# One-shot manual import of the 12 verified batch3 questions into the LIVE
# Supabase production database, through the real admin API pipeline
# (POST /api/admin/import -> needs_review). Uses the DATABASE_URL secret
# stored in repo settings during the M10 production switch.
# Safety: requires typing IMPORT as input; never seeds dev data; duplicate
# publicIds are skipped server-side, so re-runs cannot double-insert.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type IMPORT to confirm writing to the live database'
        required: true
        default: ''

jobs:
  import:
    if: ${{ github.event.inputs.confirm == 'IMPORT' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ADMIN_EMAILS: admin@jee-nexus.dev
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Generate Prisma client
        run: bunx prisma generate
      - name: Preflight - batch3 seed integrity (181 local checks, no DB)
        run: python3 scripts/verify_seed_batch3.py
      - name: Start dev server against live Supabase (NO seeding)
        run: |
          bun run dev &
          for i in $(seq 1 60); do
            curl -sS -m 2 -o /dev/null http://localhost:3000/ && break
            sleep 2
          done
          curl -sS -m 5 -o /dev/null http://localhost:3000/
      - name: Import 12 batch3 questions through the real admin pipeline
        run: python3 scripts/import_batch3.py

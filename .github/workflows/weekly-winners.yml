name: weekly winners snapshot

# Pins the top-3 of each CLOSED leaderboard week into weekly_winners via
# POST /api/leaderboard/snapshot (bearer SNAPSHOT_TOKEN repo secret).
#
# Monday 00:05 UTC (= Monday 05:35 IST): the trailing-7-day board is about
# to flip for a fresh week, so the ending week is pinned right at its
# boundary. The window is DERIVED from the run date — most recent Monday
# 00:00 UTC and the 7 days before it — making the pinned window
# deterministic regardless of runner delay, and the endpoint idempotent
# (unique window+rank, skipDuplicates) so re-runs are always safe.
#
# Manual runs (workflow_dispatch) pin the same "most recently closed week"
# — used for backfills, e.g. running once on deploy day.

on:
  schedule:
    - cron: "5 0 * * 1"
  workflow_dispatch: {}

permissions: {}

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SNAPSHOT_TOKEN: ${{ secrets.SNAPSHOT_TOKEN }}
      LIVE_URL: https://jee-nexus-app.jee-nexus.workers.dev
    steps:
      - uses: actions/checkout@v4

      - name: Pin closed-week top-3
        run: python3 scripts/weekly_snapshot.py

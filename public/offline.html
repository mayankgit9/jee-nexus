<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>JEE NEXUS — Offline</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #0b0e13; color: #e6edf3;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 420px; width: 100%;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px; padding: 32px;
      text-align: center;
    }
    h1 { font-size: 20px; margin-bottom: 10px; letter-spacing: 0.02em; }
    p { font-size: 14px; line-height: 1.6; color: #9aa7b3; margin-bottom: 8px; }
    .accent { color: #57d9a3; font-weight: 700; letter-spacing: 0.18em; font-size: 11px; text-transform: uppercase; margin-bottom: 14px; display: block; }
    button {
      margin-top: 20px; padding: 10px 22px; border-radius: 10px;
      background: #57d9a3; border: none; color: #08130d;
      font-weight: 700; font-size: 14px; cursor: pointer;
    }
    button:hover { filter: brightness(1.1); }
  </style>
</head>
<body>
  <div class="card">
    <span class="accent">JEE NEXUS</span>
    <h1>You are offline</h1>
    <p>This page needs a connection. Questions and solutions you viewed earlier still work — open the app and browse your library, notebook and formulas offline.</p>
    <p>Answers you record offline are saved on this device and sync automatically once you reconnect.</p>
    <button onclick="location.href='/'">Open app</button>
  </div>
</body>
</html>
